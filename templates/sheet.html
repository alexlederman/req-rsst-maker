<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Creator</title>
  <link rel="icon" type="image/svg+xml" href="/assets/fred_hutch.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Aptos'; src: local('Aptos'); }
  </style>
  <style>
    :root {
      /* Fred Hutch brand colors */
      --fh-navy:        #18365D;
      --fh-dark-navy:   #112345;
      --fh-teal:        #0A799A;
      --fh-bright-blue: #00ABC8;
      --fh-yellow:      #FFB500;
      --fh-purple:      #AA4AC4;
      --fh-light-grey:  #F4F4F4;
      --fh-white:       #FFFFFF;

      --bg:           var(--fh-light-grey);
      --surface:      var(--fh-white);
      --border:       #dde1e7;
      --border-light: #eceef1;
      --text:         var(--fh-dark-navy);
      --muted:        #6b7a93;
      --rsst:         var(--fh-navy);
      --rsst-soft:    #e5eaf2;
      --req:          var(--fh-teal);
      --req-soft:     #e0f3f7;
      --action:       var(--fh-teal);
      --action-fg:    var(--fh-white);
      --danger:       #c0392b;
      --shadow-sm:    0 1px 2px rgba(17,35,69,.06), 0 2px 8px rgba(17,35,69,.06);
      --shadow:       0 2px 4px rgba(17,35,69,.06), 0 6px 20px rgba(17,35,69,.07);
      --radius:       6px;
      --mono:         'Aptos', 'Geist', system-ui, sans-serif;
      --sans:         'Aptos', 'Geist', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      padding: 0 24px;
      background: var(--fh-white);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 10;
    }

    .app-wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fh-logo {
      height: 28px;
      width: auto;
      display: block;
    }
    .app-wordmark-title {
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text);
    }
    .app-wordmark-sub {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Patient dropdown ────────────────────────────────────────────────── */
    .patient-bar { display: flex; align-items: center; gap: 6px; }

    .patient-dropdown { position: relative; }

    .patient-select-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--fh-white);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      min-width: 200px;
      justify-content: space-between;
      outline: none;
      transition: border-color .15s;
    }
    .patient-select-btn:hover { border-color: #bbb; }
    .patient-select-btn.open  { border-color: var(--fh-teal); }
    .patient-sel-label { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .patient-sel-label.placeholder { color: var(--muted); }
    .patient-chevron { flex-shrink: 0; color: var(--muted); transition: transform .15s; }
    .patient-select-btn.open .patient-chevron { transform: rotate(180deg); }

    .patient-dropdown-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      z-index: 50;
      overflow: hidden;
    }
    .patient-dropdown-panel.open { display: block; }

    .patient-option {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      transition: background .1s;
      user-select: none;
    }
    .patient-option { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
    .patient-option:hover { background: var(--bg); }
    .patient-option.active { color: var(--text); font-weight: 500; }
    .patient-option .option-check { flex-shrink: 0; color: var(--fh-teal); visibility: hidden; }
    .patient-option.active .option-check { visibility: visible; }

    .patient-dropdown-empty {
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--muted);
    }
    .patient-dropdown-divider { border: none; border-top: 1px solid var(--border-light); margin: 0; }
    .patient-dropdown-manage-btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .patient-dropdown-manage-btn:hover { color: var(--fh-teal); background: var(--req-soft); }

    /* ── Manage Patients modal ───────────────────────────────────────────── */
    .manage-modal { width: 460px; }

    .manage-toolbar {
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      justify-content: flex-end;
    }
    .manage-patient-list {
      max-height: 340px;
      overflow-y: auto;
    }
    .manage-patient-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-light);
      transition: background .1s;
    }
    .manage-patient-row:last-child { border-bottom: none; }
    .manage-patient-row:hover { background: var(--bg); }
    .manage-patient-info { flex: 1; min-width: 0; }
    .manage-patient-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .manage-patient-sub  { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .manage-patient-actions { display: flex; gap: 5px; flex-shrink: 0; }

    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--muted);
      transition: border-color .15s, color .15s, background .15s;
      flex-shrink: 0;
    }
    .btn-icon:hover        { border-color: #bbb; color: var(--text); background: var(--bg); }
    .btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); background: #fdf0ef; }

    .manage-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .manage-edit-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .btn-back {
      background: none; border: none; cursor: pointer;
      font-family: var(--sans);
      color: var(--muted);
      display: flex; align-items: center; gap: 5px;
      padding: 0;
      transition: color .15s;
    }
    .btn-back:hover { color: var(--text); }
    .btn-back svg { flex-shrink: 0; }
    .manage-edit-title { font-size: 14px; font-weight: 600; color: var(--text); }

    .btn-generate {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--fh-teal);
      color: var(--fh-white);
      border: none;
      border-radius: 6px;
      padding: 9px 20px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: opacity .15s, transform .1s;
    }
    .btn-generate:hover { opacity: .88; }
    .btn-generate:active { transform: scale(.98); }
    .btn-generate:disabled { opacity: .4; cursor: default; transform: none; }
    .btn-generate svg { flex-shrink: 0; }

    /* ── Cards scroll container ───────────────────────────────────────── */
    .canvas {
      height: calc(100vh - 56px);
      overflow-x: auto;
      overflow-y: hidden;
      padding: 28px 28px 40px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    /* ── Card ─────────────────────────────────────────────────────────── */
    .card {
      flex-shrink: 0;
      width: 288px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: card-in .25s ease both;
      position: relative;
      z-index: 1;
    }
    .rsst-card { z-index: 2; }
    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }


    /* ── Card header ──────────────────────────────────────────────────── */
    .card-header {
      padding: 14px 16px 0;
    }

    .card-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .card-badge {
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .card-remove {
      background: none;
      border: none;
      color: var(--border);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      transition: color .15s;
    }
    .card-remove:hover { color: var(--danger); }

    /* ── Template custom dropdown ─────────────────────────────────────── */
    .tmpl-dropdown { position: relative; width: 100%; }

    .tmpl-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-family: var(--sans);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      outline: none;
      transition: border-color .15s;
      text-align: left;
    }
    .tmpl-btn-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tmpl-btn-label.placeholder { color: var(--muted); font-weight: 400; }
    .tmpl-chevron { flex-shrink: 0; color: var(--muted); transition: transform .15s; }
    .tmpl-btn.open .tmpl-chevron { transform: rotate(180deg); }
    .rsst-card .tmpl-btn:hover,
    .rsst-card .tmpl-btn.open  { border-color: var(--rsst); }
    .req-card  .tmpl-btn:hover,
    .req-card  .tmpl-btn.open  { border-color: var(--req); }

    .tmpl-panel {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      z-index: 40;
    }
    .tmpl-panel.open { display: block; }
    .tmpl-panel > .tmpl-option:first-child,
    .tmpl-panel > .tmpl-submenu-item:first-child { border-radius: 6px 6px 0 0; }
    .tmpl-panel > .tmpl-option:last-child,
    .tmpl-panel > .tmpl-submenu-item:last-child { border-radius: 0 0 6px 6px; }
    .tmpl-panel > :only-child { border-radius: 6px; }

    .tmpl-option {
      height: 32px;
      padding: 0 10px;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background .1s, color .1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-sizing: border-box;
    }
    .tmpl-option:hover { background: var(--bg); color: var(--text); }
    .tmpl-option.active { color: var(--text); font-weight: 500; }
    .tmpl-option .option-check { flex-shrink: 0; color: var(--fh-teal); visibility: hidden; }
    .tmpl-option.active .option-check { visibility: visible; }

    .tmpl-submenu-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      height: 32px;
      padding: 0 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      cursor: default;
      user-select: none;
      transition: background .1s;
      box-sizing: border-box;
    }
    .tmpl-submenu-item:hover { background: var(--bg); }
    .tmpl-submenu-item + .tmpl-submenu-item,
    .tmpl-option + .tmpl-submenu-item { border-top: 1px solid var(--border-light); }
    .tmpl-submenu-chevron { flex-shrink: 0; color: var(--muted); }

    .tmpl-submenu-panel {
      display: none;
      position: absolute;
      top: -1px;
      left: 100%;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: var(--shadow);
      z-index: 50;
      overflow: hidden;
    }
    .tmpl-submenu-panel.flip-left { left: auto; right: 100%; }
    .tmpl-submenu-item:hover > .tmpl-submenu-panel { display: block; }

    .card-name-input {
      width: 100%;
      margin-top: 8px;
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      padding: 4px 0 3px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--muted);
      outline: none;
      transition: border-color .2s, color .2s;
    }
    .card-name-input:hover { border-color: var(--border); }
    .card-name-input:focus { border-color: var(--rsst); color: var(--text); }
    .req-card .card-name-input:focus { border-color: var(--req); }

    /* ── Card body ────────────────────────────────────────────────────── */
    .card-body {
      padding: 16px 16px 20px 16px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0;
      color: var(--muted);
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .field-label .badge-shared {
      font-size: 8px;
      letter-spacing: 0.06em;
      background: #f0e8ff;
      color: #6b3fa0;
      border-radius: 2px;
      padding: 1px 5px;
    }
    .field-label .badge-auto {
      font-size: 8px;
      letter-spacing: 0.06em;
      background: #fff3d6;
      color: #8a5c00;
      border-radius: 2px;
      padding: 1px 5px;
    }
    .field-label .badge-mirror {
      font-size: 8px;
      letter-spacing: 0.06em;
      background: #f0e8e8;
      color: #7a3a3a;
      border-radius: 2px;
      padding: 1px 5px;
    }

    .field-input {
      display: block;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 6px 0 5px;
      font-family: var(--sans);
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .field-input::placeholder { color: #c4c0b8; }
    .field-input:focus { border-color: var(--rsst); }
    .req-card .field-input:focus { border-color: var(--req); }

    .field-input.auto-val {
      color: var(--muted);
      pointer-events: none;
    }

    .field-input.mirror-val {
      color: var(--muted);
      pointer-events: none;
    }
    .field-input.mirror-val::placeholder { color: #ccc; }

    .field-textarea {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
      outline: none;
      resize: vertical;
      min-height: 96px;
      transition: border-color .2s;
      line-height: 1.5;
    }
    .field-textarea::placeholder { color: #c4c0b8; }
    .field-textarea:focus { border-color: var(--req); background: var(--surface); }
    .field-textarea.mirror-val {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      border-radius: 0;
      padding: 6px 0 5px;
      resize: none;
      overflow: hidden;
      cursor: default;
      color: var(--muted);
      min-height: unset;
      height: auto;
    }

    /* Divider inside card */
    .card-divider {
      border: none;
      border-top: 1px solid var(--border-light);
      margin: 16px 0;
    }

    /* ── Add-Req card (ghost) ─────────────────────────────────────────── */
    .card-add {
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color .2s, color .2s, background .2s;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      padding: 9px 16px;
      align-self: flex-start;
      box-shadow: var(--shadow-sm);
    }
    .card-add:hover { border-color: #bbb; color: var(--text); background: var(--bg); }
    .card-add-icon {
      font-size: 16px;
      line-height: 1;
    }

    /* ── Drag-and-drop ───────────────────────────────────────────────────── */
    .card.req-card { cursor: grab; }
    .card.req-card:active { cursor: grabbing; }
    .card.req-card input, .card.req-card select,
    .card.req-card textarea, .card.req-card button { cursor: auto; }
    .card-ghost {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 16px 48px rgba(17,35,69,.22);
    }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      gap: 10px;
      color: var(--muted);
    }
    .empty-state-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
    }
    .empty-state-sub {
      font-size: 13px;
    }

    /* ── Modal ───────────────────────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(17,35,69,.35);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 6px;
      box-shadow: var(--shadow);
      width: 380px;
      overflow: hidden;
      animation: card-in .2s ease both;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 0 2px;
    }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 12px; }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
    }
    .btn-modal-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 14px;
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
    }
    .btn-modal-cancel:hover { background: var(--bg); }
    .btn-modal-save {
      background: var(--fh-teal);
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      color: var(--fh-white);
      transition: opacity .15s;
    }
    .btn-modal-save:hover { opacity: .88; }

    /* ── Toast ────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #1c1a17;
      color: #f5f3ef;
      padding: 9px 22px;
      border-radius: 100px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.02em;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,.25);
      animation: none;
    }
    .toast.show {
      display: block;
      animation: toast-in .2s ease both;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────────────────────────── -->
<div class="toolbar">
  <div class="app-wordmark">
    <img src="/assets/fred_hutch.svg" alt="Fred Hutch" class="fh-logo">
    <span class="app-wordmark-title">Form Creator</span>
  </div>
  <div class="patient-bar">
    <div class="patient-dropdown" id="patient-dropdown">
      <button class="patient-select-btn" id="patient-sel-btn" onclick="togglePatientDropdown()">
        <span class="patient-sel-label placeholder" id="patient-sel-label">Select Patient</span>
        <svg class="patient-chevron" width="12" height="7" viewBox="0 0 12 7" fill="none">

<div class="empty-state" id="empty-state">

<!-- ── Canvas ────────────────────────────────────────────────────────────── -->
<div class="canvas" id="canvas" style="display:none">

<!-- Manage Patients Modal -->
<div class="modal-overlay" id="manage-modal-overlay" onclick="closeManagePatientsModal()">

    <div id="manage-edit-view" style="display:none">
      <div class="manage-edit-header">
        <button class="btn-back" onclick="closeManageEditView()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <div class="field">
          <div class="field-label">Subject ID</div>
          <input class="field-input" type="text" id="manage-edit-subject-id" placeholder="Subject ID" autocomplete="off">
        </div>
        <div class="field">
          <div class="field-label">Patient Identifier</div>
          <textarea class="field-textarea" id="manage-edit-identifier" rows="4" placeholder="MRN&#10;DOB: AGE M/F&#10;&#10;NAME"></textarea>

<script>
// ── Server data ────────────────────────────────────────────────────────────
// Groups: [{group: str, files: [rel_path, ...]}, ...]
const RSST_GROUPS  = {{ rsst_groups_json | safe }};
const REQ_GROUPS   = {{ req_groups_json | safe }};
const RSST_PREFILL = {{ rsst_prefills_json | safe }};
const REQ_PREFILL  = {{ req_prefills_json | safe }};

// Flat lists for convenience
const RSST_FILES = RSST_GROUPS.flatMap(g => g.files);
const REQ_FILES  = REQ_GROUPS.flatMap(g => g.files);

const TODAY = (() => {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(-2)}`;
})();

// PDF field names — must mirror app.py RSST_MAP / REQ_MAP
const RSST_PDF = { study_subject_id: 'Study-Subject-ID' };
const REQ_PDF  = { patient_identifier: 'Patient Indentifiers' };

// RSST field definitions
const RSST_FIELDS = [
  { id: 'collection_date',  label: 'Collection Date',  shared: true,  dateInput: true },
  { id: 'collection_time',  label: 'Collection Time',  shared: false },
  { id: 'study_subject_id', label: 'Study Subject ID', shared: true,  fromPatient: true },
  { id: 'subject_initials', label: 'Subject Initials', shared: false, fromPatient: true },
  { id: 'mrn',              label: 'MRN',              shared: false, fromPatient: true },
  { id: 'date_submitted',   label: 'Date Submitted',   shared: false, auto: true },
];

let reqCount = 0;

// ── Helpers ────────────────────────────────────────────────────────────────
function toast(msg, ms = 3500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}

function getRsstVal(fid) {
  const el = document.getElementById(`rsst-${fid}`);
  return el ? el.value : '';
}

function formatDateMDY(yyyymmdd) {
  if (!yyyymmdd) return '';
  const [y, m, d] = yyyymmdd.split('-');
  return `${parseInt(m)}/${parseInt(d)}/${y.slice(-2)}`;
}

function updateMirrors(fid) {
  const inp = document.getElementById(`rsst-${fid}`);
  if (!inp) return;
  const val = inp.type === 'date' ? formatDateMDY(inp.value) : inp.value;
  document.querySelectorAll(`.mirror-${fid}`).forEach(el => { el.value = val; });
}

function getRsstFieldValue(fid) {
  const inp = document.getElementById(`rsst-${fid}`);
  if (!inp) return '';
  return inp.type === 'date' ? formatDateMDY(inp.value) : inp.value;
}

function makeMirrorLabel(text) {
  return `${text} <span class="badge-mirror">from RSST</span>`;
}

// ── Template dropdown builder ───────────────────────────────────────────────
const _checkSvgTmpl = `<svg class="option-check" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l4 4 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function _makeTmplOption(rel, selectedVal, containerId, onChange) {
  const label = rel.split('/').pop().replace(/\.pdf$/i, '');
  const opt = document.createElement('div');
  opt.className = `tmpl-option${rel === selectedVal ? ' active' : ''}`;
  opt.dataset.value = rel;
  opt.innerHTML = `<span>${label}</span>${_checkSvgTmpl}`;
  opt.addEventListener('click', e => {
    e.stopPropagation();
    setTmplDropdownValue(containerId, rel);
    onChange(rel);
  });
  return opt;
}

function buildTmplDropdown(containerId, groups, selectedVal, onChange) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';

  const dropId  = containerId + '-panel';
  const btnId   = containerId + '-btn';
  const labelId = containerId + '-label';

  // Button
  const btn = document.createElement('button');
  btn.className = 'tmpl-btn';
  btn.id = btnId;
  btn.type = 'button';
  btn.innerHTML = `<span class="tmpl-btn-label${selectedVal ? '' : ' placeholder'}" id="${labelId}">${selectedVal ? selectedVal.split('/').pop().replace(/\.pdf$/i,'') : 'Select Template'}</span><svg class="tmpl-chevron" width="12" height="7" viewBox="0 0 12 7" fill="none"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  // Panel
  const panel = document.createElement('div');
  panel.className = 'tmpl-panel';
  panel.id = dropId;

  const rootGroup = groups.find(g => g.group === '');
  const subGroups = groups.filter(g => g.group !== '');

  // Root-level files (no group) — plain options
  if (rootGroup) {
    rootGroup.files.forEach(rel => {
      panel.appendChild(_makeTmplOption(rel, selectedVal, containerId, onChange));
    });
  }

  // Grouped files — flyout submenu items
  subGroups.forEach(({group, files}) => {
    const item = document.createElement('div');
    item.className = 'tmpl-submenu-item';
    item.innerHTML = `<span>${group}</span><svg class="tmpl-submenu-chevron" width="6" height="10" viewBox="0 0 6 10" fill="none"><path d="M1 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

    const subPanel = document.createElement('div');
    subPanel.className = 'tmpl-submenu-panel';
    files.forEach(rel => {
      subPanel.appendChild(_makeTmplOption(rel, selectedVal, containerId, onChange));
    });

    // Flip submenu left if it would overflow the viewport
    item.addEventListener('mouseenter', () => {
      const rect = subPanel.getBoundingClientRect();
      subPanel.classList.toggle('flip-left', rect.right > window.innerWidth - 8);
    });

    item.appendChild(subPanel);
    panel.appendChild(item);
  });

  btn.addEventListener('click', e => {
    e.stopPropagation();
    const isOpen = panel.classList.toggle('open');
    btn.classList.toggle('open', isOpen);
    if (isOpen) {
      setTimeout(() => document.addEventListener('click', function _c(ev) {
        if (!container.contains(ev.target)) { closeTmplDropdown(containerId); }
        document.removeEventListener('click', _c);
      }), 0);
    }
  });

  container.appendChild(btn);
  container.appendChild(panel);
}

function setTmplDropdownValue(containerId, val) {
  const panel   = document.getElementById(containerId + '-panel');
  const labelEl = document.getElementById(containerId + '-label');
  const btn     = document.getElementById(containerId + '-btn');
  if (!panel || !labelEl) return;
  // Update options active state
  panel.querySelectorAll('.tmpl-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.value === val);
  });
  // Update button label
  labelEl.textContent = val ? val.split('/').pop().replace(/\.pdf$/i,'') : 'Select Template';
  labelEl.classList.toggle('placeholder', !val);
  // Store value on container
  document.getElementById(containerId).dataset.value = val || '';
  closeTmplDropdown(containerId);
}

function getTmplDropdownValue(containerId) {
  return document.getElementById(containerId)?.dataset.value || '';
}

function closeTmplDropdown(containerId) {
  document.getElementById(containerId + '-panel')?.classList.remove('open');
  document.getElementById(containerId + '-btn')?.classList.remove('open');
}

function disableTmplOption(containerId, val, disabled) {
  const panel = document.getElementById(containerId + '-panel');
  if (!panel) return;
  panel.querySelectorAll('.tmpl-option').forEach(opt => {
    if (opt.dataset.value === val) {
      opt.style.opacity = disabled ? '.35' : '';
      opt.style.pointerEvents = disabled ? 'none' : '';
    }
  });
}

function makeField(label, inputEl, badgeHtml) {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lbl = document.createElement('div');
  lbl.className = 'field-label';
  lbl.innerHTML = label + (badgeHtml || '');
  wrap.appendChild(lbl);
  wrap.appendChild(inputEl);
  return wrap;
}

// ── Patient database ──────────────────────────────────────────────────────
let patients = [];
let selectedPatientId = '';

function fitTextarea(ta) {
  ta.style.height = 'auto';
  ta.style.height = ta.scrollHeight + 'px';
}

function patientLabel(patient) {
  return patient.initials || (patient.identifier || '').split('\n')[0].trim() || 'Unknown';
}

// ── Custom patient dropdown ────────────────────────────────────────────────
function renderPatientDropdown() {
  const opts = document.getElementById('patient-dropdown-options');
  const checkSvg = `<svg class="option-check" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l4 4 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (patients.length === 0) {
    opts.innerHTML = `<div class="patient-dropdown-empty">No patients yet</div>`;
  } else {
    opts.innerHTML = patients.map(p =>
      `<div class="patient-option${p.id === selectedPatientId ? ' active' : ''}"
            onclick="selectPatient('${p.id}')">${patientLabel(p)}${checkSvg}</div>`
    ).join('');
  }
  // Update button label
  const lbl = document.getElementById('patient-sel-label');
  const btn = document.getElementById('patient-sel-btn');
  const patient = patients.find(p => p.id === selectedPatientId);
  if (patient) {
    lbl.textContent = patientLabel(patient);
    lbl.classList.remove('placeholder');
  } else {
    lbl.textContent = 'Select Patient';
    lbl.classList.add('placeholder');
  }
}

function togglePatientDropdown() {
  const panel = document.getElementById('patient-dropdown-panel');
  const btn   = document.getElementById('patient-sel-btn');
  const open  = panel.classList.toggle('open');
  btn.classList.toggle('open', open);
  if (open) {
    // Close on outside click
    setTimeout(() => document.addEventListener('click', _closeDropdownOutside, { once: true }), 0);
  }
}

function _closeDropdownOutside(e) {
  if (!document.getElementById('patient-dropdown').contains(e.target)) {
    closePatientDropdown();
  }
}

function closePatientDropdown() {
  document.getElementById('patient-dropdown-panel').classList.remove('open');
  document.getElementById('patient-sel-btn').classList.remove('open');
}

async function loadPatients() {
  const resp = await fetch('/patients');
  patients = await resp.json();
  renderPatientDropdown();
}

function selectPatient(pid) {
  selectedPatientId = pid || '';
  closePatientDropdown();
  renderPatientDropdown();

  if (!pid) {
    document.getElementById('canvas').style.display = 'none';
    document.getElementById('empty-state').style.display = 'flex';
    validateForm();
    return;
  }
  document.getElementById('canvas').style.display = 'flex';
  document.getElementById('empty-state').style.display = 'none';

  const patient = patients.find(p => p.id === pid);
  if (!patient) return;

  const identifier = patient.identifier;
  const mrn = (identifier.split('\n')[0] || '').trim();

  const mrnInp = document.getElementById('rsst-mrn');
  if (mrnInp) mrnInp.value = mrn;
  const initialsInp = document.getElementById('rsst-subject_initials');
  if (initialsInp) initialsInp.value = patient.initials || '';
  const ssidInp = document.getElementById('rsst-study_subject_id');
  if (ssidInp) { ssidInp.value = patient.subject_id || ''; updateMirrors('study_subject_id'); }

  document.querySelectorAll('.card.req-card').forEach(card => {
    const cid = card.id.replace('card-', '');
    const ta  = document.getElementById(`pid-${cid}`);
    if (ta) { ta.value = identifier; fitTextarea(ta); }
  });
  validateForm();
}

// ── Manage Patients modal ─────────────────────────────────────────────────
function openManagePatientsModal() {
  renderManagePatientsList();
  document.getElementById('manage-list-view').style.display = '';
  document.getElementById('manage-edit-view').style.display = 'none';
  document.getElementById('manage-modal-overlay').classList.add('open');
}

function closeManagePatientsModal() {
  document.getElementById('manage-modal-overlay').classList.remove('open');
}

function renderManagePatientsList() {
  const list = document.getElementById('manage-patient-list');
  if (patients.length === 0) {
    list.innerHTML = `<div class="manage-empty">No patients yet. Add one to get started.</div>`;
    return;
  }
  list.innerHTML = patients.map(p => {
    const sub = [p.subject_id, (p.identifier || '').split('\n')[0]].filter(Boolean).join(' · ');
    return `
      <div class="manage-patient-row">
        <div class="manage-patient-info">
          <div class="manage-patient-name">${patientLabel(p)}</div>
          ${sub ? `<div class="manage-patient-sub">${sub}</div>` : ''}
        </div>
        <div class="manage-patient-actions">
          <button class="btn-icon" title="Edit" onclick="openManageEditView('${p.id}')">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9.5 1.5l2 2-7 7H2.5v-2l7-7z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-icon danger" title="Delete" onclick="deleteManagePatient('${p.id}')">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M5 3.5V2.5h3v1M5.5 6v3.5M7.5 6v3.5M3 3.5l.5 7h6l.5-7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');
}

function openManageEditView(pid) {
  const isNew = !pid;
  document.getElementById('manage-edit-title').textContent = isNew ? 'New Patient' : 'Edit Patient';
  document.getElementById('manage-edit-id').value         = pid || '';
  const patient = pid ? patients.find(p => p.id === pid) : null;
  document.getElementById('manage-edit-initials').value    = patient?.initials    || '';
  document.getElementById('manage-edit-subject-id').value  = patient?.subject_id  || '';
  document.getElementById('manage-edit-identifier').value  = patient?.identifier  || '';
  document.getElementById('manage-list-view').style.display = 'none';
  document.getElementById('manage-edit-view').style.display = '';
  document.getElementById('manage-edit-initials').focus();
}

function closeManageEditView() {
  document.getElementById('manage-list-view').style.display = '';
  document.getElementById('manage-edit-view').style.display = 'none';
  renderManagePatientsList();
}

async function saveManagePatient() {
  const pid        = document.getElementById('manage-edit-id').value;
  const initials   = document.getElementById('manage-edit-initials').value.trim();
  const subject_id = document.getElementById('manage-edit-subject-id').value.trim();
  const identifier = document.getElementById('manage-edit-identifier').value.trim();
  if (!identifier) { toast('Patient identifier is required.'); return; }

  if (pid) {
    // Update existing
    const resp = await fetch(`/patients/${pid}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, initials, subject_id }),
    });
    if (!resp.ok) { toast('Failed to update patient.'); return; }
    const updated = await resp.json();
    const idx = patients.findIndex(p => p.id === pid);
    if (idx !== -1) patients[idx] = updated;
    if (selectedPatientId === pid) selectPatient(pid); // refresh cards
    toast(`Updated: ${patientLabel(updated)}`);
  } else {
    // Create new
    const resp = await fetch('/patients', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier, initials, subject_id }),
    });
    if (!resp.ok) { toast('Failed to save patient.'); return; }
    const patient = await resp.json();
    patients.push(patient);
    selectPatient(patient.id);
    toast(`Patient saved: ${patientLabel(patient)}`);
  }
  renderPatientDropdown();
  closeManageEditView();
}

async function deleteManagePatient(pid) {
  const patient = patients.find(p => p.id === pid);
  if (!patient) return;
  const label = patientLabel(patient);
  const resp = await fetch(`/patients/${pid}`, { method: 'DELETE' });
  if (!resp.ok) { toast('Failed to remove patient.'); return; }
  patients = patients.filter(p => p.id !== pid);
  if (selectedPatientId === pid) selectPatient('');
  renderPatientDropdown();
  renderManagePatientsList();
  toast(`Removed: ${label}`);
}

// ── Init ───────────────────────────────────────────────────────────────────
function init() {
  // Build RSST custom dropdown
  const autoSelect = RSST_FILES.length === 1 ? RSST_FILES[0] : '';
  buildTmplDropdown('rsst-tmpl-dropdown', RSST_GROUPS, autoSelect, val => {
    document.getElementById('rsst-tmpl-dropdown').dataset.value = val;
    onRsstTmpl();
  });
  if (autoSelect) document.getElementById('rsst-tmpl-dropdown').dataset.value = autoSelect;

  // Build RSST field inputs
  const body = document.getElementById('rsst-body');
  RSST_FIELDS.forEach(f => {
    let inp;
    if (f.auto) {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'field-input auto-val';
      inp.value = TODAY;
      inp.disabled = true;
      body.appendChild(makeField(f.label, inp, ''));
    } else if (f.dateInput) {
      const inp = document.createElement('input');
      inp.type = 'date';
      inp.className = 'field-input';
      inp.id = `rsst-${f.id}`;
      inp.addEventListener('change', () => { updateMirrors(f.id); validateForm(); });
      body.appendChild(makeField(f.label, inp, ''));
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.className = f.fromPatient ? 'field-input mirror-val' : 'field-input';
      inp.id = `rsst-${f.id}`;
      inp.readOnly = !!f.fromPatient;
      inp.placeholder = f.id === 'collection_time' ? 'HH:MM' : ' ';
      inp.addEventListener('input', () => { if (f.shared) updateMirrors(f.id); validateForm(); });
      body.appendChild(makeField(f.label, inp, ''));
    }
  });

  if (autoSelect) onRsstTmpl();

  // Start with one Req card
  addReqCard(REQ_FILES.length === 1 ? REQ_FILES[0] : '');
}

// ── RSST template change ───────────────────────────────────────────────────
function onRsstTmpl() {
  validateForm();
}

function getRsstTmpl() {
  return getTmplDropdownValue('rsst-tmpl-dropdown');
}

// ── Add Req card ───────────────────────────────────────────────────────────
function addReqCard(defaultTmpl) {
  defaultTmpl = defaultTmpl || '';
  const cid  = `req${reqCount++}`;
  const colN = reqCount;

  const card = document.createElement('div');
  card.className = 'card req-card';
  card.id = `card-${cid}`;

  // ── Header ──
  const hdr = document.createElement('div');
  hdr.className = 'card-header';

  const hdrTop = document.createElement('div');
  hdrTop.className = 'card-header-top';
  hdrTop.appendChild(document.createElement('span')).className = 'card-badge';
  hdrTop.querySelector('.card-badge').textContent = 'Req';
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('input, select, textarea, button, .tmpl-dropdown')) return;
    startCardDrag(e, card);
  });
  const removeBtn = document.createElement('button');
  removeBtn.className = 'card-remove';
  removeBtn.title = 'Remove';
  removeBtn.textContent = '×';
  removeBtn.onclick = () => removeReqCard(cid);
  hdrTop.appendChild(removeBtn);
  hdr.appendChild(hdrTop);

  const tmplWrap = document.createElement('div');
  tmplWrap.className = 'field-tmpl';
  const tmplLbl = document.createElement('div');
  tmplLbl.className = 'field-label';
  tmplLbl.style.marginBottom = '5px';
  tmplLbl.textContent = 'Template';
  tmplWrap.appendChild(tmplLbl);
  const tmplDropId = `sel-${cid}`;
  const tmplDropEl = document.createElement('div');
  tmplDropEl.className = 'tmpl-dropdown';
  tmplDropEl.id = tmplDropId;
  tmplWrap.appendChild(tmplDropEl);
  hdr.appendChild(tmplWrap);


  card.appendChild(hdr);

  // ── Body ──
  const body = document.createElement('div');
  body.className = 'card-body';

  // Patient Identifier textarea
  const pidTa = document.createElement('textarea');
  pidTa.className = 'field-textarea mirror-val';
  pidTa.id = `pid-${cid}`;
  pidTa.readOnly = true;
  pidTa.rows = 1;
  pidTa.placeholder = 'No patient selected';
  body.appendChild(makeField('Patient Identifier', pidTa, ''));

  // Shared field mirrors
  [
    { id: 'collection_date',  label: 'Collection Date'  },
    { id: 'study_subject_id', label: 'Study Subject ID' },
  ].forEach(f => {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = `field-input mirror-val mirror-${f.id}`;
    inp.readOnly = true;
    inp.placeholder = '—';
    const src = document.getElementById(`rsst-${f.id}`);
    inp.value = src ? src.value : '';
    body.appendChild(makeField(f.label, inp, ''));
  });

  card.appendChild(body);

  // Insert before the add button
  const addBtn = document.getElementById('add-req-btn');
  document.getElementById('canvas').insertBefore(card, addBtn);

  // Build the dropdown after card is in DOM
  buildTmplDropdown(tmplDropId, REQ_GROUPS, defaultTmpl, val => {
    document.getElementById(tmplDropId).dataset.value = val;
    onReqTmpl(cid);
    updateReqTemplateOptions();
    validateForm();
  });
  if (defaultTmpl) document.getElementById(tmplDropId).dataset.value = defaultTmpl;

  updateReqTemplateOptions();
  if (defaultTmpl) onReqTmpl(cid);
}

// ── Remove Req card ────────────────────────────────────────────────────────
function removeReqCard(cid) {
  const card = document.getElementById(`card-${cid}`);
  if (card) card.remove();
  updateReqTemplateOptions();
  validateForm();
}

// ── Req template change ────────────────────────────────────────────────────
function onReqTmpl(cid) {
  // Template change does not affect patient identifier — that comes from patient selection only
}

// ── Req template uniqueness ────────────────────────────────────────────────
function updateReqTemplateOptions() {
  const selected = new Set();
  document.querySelectorAll('.card.req-card').forEach(card => {
    const cid = card.id.replace('card-', '');
    const val = getTmplDropdownValue(`sel-${cid}`);
    if (val) selected.add(val);
  });
  document.querySelectorAll('.card.req-card').forEach(card => {
    const cid = card.id.replace('card-', '');
    const cur = getTmplDropdownValue(`sel-${cid}`);
    REQ_FILES.forEach(f => {
      disableTmplOption(`sel-${cid}`, f, f !== cur && selected.has(f));
    });
  });
}

// ── Pointer-based drag-and-drop reorder ───────────────────────────────────
let _drag = null;

function startCardDrag(e, card) {
  e.preventDefault();

  const canvas = document.getElementById('canvas');
  // Clear animations and transforms before snapshotting positions.
  // animation-fill-mode:both on card-in locks transform:none which would override drag transforms.
  canvas.querySelectorAll('.card.req-card').forEach(c => {
    c.style.animation  = 'none';
    c.style.transition = '';
    c.style.transform  = '';
  });

  const rect = card.getBoundingClientRect();
  const allCards = Array.from(canvas.querySelectorAll('.card.req-card'));
  const originalIndex = allCards.indexOf(card);
  const otherCards = allCards.filter(c => c !== card);
  // Snapshot natural (un-transformed) positions once — they won't change during drag
  const naturalPositions = otherCards.map(c => c.getBoundingClientRect().left);

  const ghost = card.cloneNode(true);
  ghost.className = (ghost.className + ' card-ghost').trim();
  ghost.style.left      = rect.left  + 'px';
  ghost.style.top       = rect.top   + 'px';
  ghost.style.width     = rect.width + 'px';
  ghost.style.transform = 'scale(1.025)';
  ghost.style.animation = 'none'; // prevent card-in fade-in on clone
  document.body.appendChild(ghost);

  card.style.visibility = 'hidden';

  _drag = {
    card, ghost, originalIndex, otherCards, naturalPositions,
    cardWidth:   rect.width,
    targetIndex: originalIndex,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
  };

  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup',   onDragDrop);
}

function onDragMove(e) {
  if (!_drag) return;
  const { ghost, card, originalIndex, otherCards, naturalPositions, cardWidth, offsetX, offsetY } = _drag;

  ghost.style.left = (e.clientX - offsetX) + 'px';
  ghost.style.top  = (e.clientY - offsetY) + 'px';

  // Determine target slot among otherCards using snapshotted natural positions
  const ghostMidX = e.clientX - offsetX + cardWidth / 2;
  let targetIndex = otherCards.length;
  for (let i = 0; i < otherCards.length; i++) {
    if (ghostMidX < naturalPositions[i] + cardWidth / 2) {
      targetIndex = i;
      break;
    }
  }

  if (_drag.targetIndex === targetIndex) return;
  _drag.targetIndex = targetIndex;

  // For each otherCard, compute its slot in the current layout vs the target layout.
  // naturalSlot: its flex slot now (invisible dragged card still occupies originalIndex)
  // finalSlot:   its flex slot after drop (dragged card occupies targetIndex)
  const gap = 16;
  otherCards.forEach((c, i) => {
    const naturalSlot = i < originalIndex ? i : i + 1;
    const finalSlot   = i < targetIndex   ? i : i + 1;
    const dx = (finalSlot - naturalSlot) * (cardWidth + gap);
    c.style.transition = 'transform 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
    c.style.transform  = dx ? `translateX(${dx}px)` : '';
  });
}

function onDragDrop() {
  if (!_drag) return;
  const { card, ghost, otherCards, targetIndex } = _drag;
  const canvas = document.getElementById('canvas');
  const addBtn = document.getElementById('add-req-btn');

  // Snap transforms off before DOM reorder to avoid any flash
  otherCards.forEach(c => { c.style.transition = 'none'; c.style.transform = ''; c.style.animation = 'none'; });

  const insertBefore = otherCards[targetIndex] || addBtn;
  canvas.insertBefore(card, insertBefore);
  card.style.visibility = '';
  ghost.remove();

  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup',   onDragDrop);
  _drag = null;
}

// ── Form validation ────────────────────────────────────────────────────────
function validateForm() {
  const rsstFields = ['collection_date','collection_time','study_subject_id','subject_initials','mrn'];
  const rsstTmpl = getRsstTmpl();
  if (!rsstTmpl) { document.getElementById('gen-btn').disabled = true; return; }

  for (const fid of rsstFields) {
    if (!getRsstFieldValue(fid).trim()) {
      document.getElementById('gen-btn').disabled = true; return;
    }
  }

  const reqCards = document.querySelectorAll('.card.req-card');
  if (!reqCards.length) { document.getElementById('gen-btn').disabled = true; return; }

  for (const card of reqCards) {
    const cid  = card.id.replace('card-', '');
    const tmpl = getTmplDropdownValue(`sel-${cid}`);
    const pid  = document.getElementById(`pid-${cid}`)?.value?.trim();
    if (!tmpl || !pid) { document.getElementById('gen-btn').disabled = true; return; }
  }

  document.getElementById('gen-btn').disabled = false;
}

// ── Generate ───────────────────────────────────────────────────────────────
async function generateAll() {
  const rsstTmpl   = getRsstTmpl();
  const initials   = getRsstVal('subject_initials').trim();
  const rsstBase   = rsstTmpl.split('/').pop().replace(/\.pdf$/i, '') || 'RSST';
  const rsstName   = initials ? `${rsstBase} ${initials}` : rsstBase;


  const rsstFields = {};
  ['collection_date','collection_time','study_subject_id','subject_initials','mrn'].forEach(fid => {
    const v = getRsstFieldValue(fid).trim();
    if (v) rsstFields[fid] = v;
  });

  const reqForms = [];
  document.querySelectorAll('.card.req-card').forEach(card => {
    const cid      = card.id.replace('card-', '');
    const tmpl     = getTmplDropdownValue(`sel-${cid}`);
    const tmplBase = tmpl.split('/').pop().replace(/\.pdf$/i, '') || 'Req';
    const name     = initials ? `${tmplBase} ${initials}` : tmplBase;
    const pid      = (document.getElementById(`pid-${cid}`)?.value || '').trim();
    reqForms.push({ template: tmpl, name, patient_identifier: pid });
  });

  if (!rsstTmpl && reqForms.every(r => !r.template)) {
    toast('Select at least one template to generate.');
    return;
  }

  const btn = document.getElementById('gen-btn');
  btn.disabled = true;
  btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="animation:spin .8s linear infinite"><path d="M7 1a6 6 0 110 12A6 6 0 017 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="28" stroke-dashoffset="14"/></svg> Generating…`;

  try {
    const resp = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rsst_template: rsstTmpl, rsst_name: rsstName, rsst_fields: rsstFields, req_forms: reqForms }),
    });

    if (!resp.ok) { toast(`Error ${resp.status}: ${resp.statusText}`); return; }

    const data = await resp.json();
    if (data.cancelled) { toast('Save cancelled.'); return; }
    const n = (rsstTmpl ? 1 : 0) + reqForms.filter(r => r.template).length;
    toast(`Saved ${n} PDF${n !== 1 ? 's' : ''} to ${data.folder}`);
  } catch (e) {
    toast(`Error: ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 10v1a1 1 0 001 1h8a1 1 0 001-1v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Generate PDFs`;
  }
}

// ── Spin animation ─────────────────────────────────────────────────────────
const spinStyle = document.createElement('style');
spinStyle.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(spinStyle);

// ── Boot ───────────────────────────────────────────────────────────────────
init();
loadPatients();
</script>
