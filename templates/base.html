<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PDF Form Filler{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header a { color: #0071e3; text-decoration: none; font-size: 14px; }
    header a:hover { text-decoration: underline; }
    .container {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 24px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      padding: 32px;
      margin-bottom: 24px;
    }
    h2 { font-size: 20px; font-weight: 600; margin-bottom: 20px; }
    h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #444; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #444; }
    input[type="text"], input[type="file"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus { border-color: #0071e3; background: #fff; }
    input[type="checkbox"] { width: auto; margin-right: 6px; }
    .checkbox-row { display: flex; align-items: center; margin-bottom: 8px; }
    .checkbox-row label { margin: 0; font-weight: 400; }
    .field-row { margin-bottom: 14px; }
    .btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #0071e3; color: #fff; }
    .btn-secondary { background: #e0e0e0; color: #1d1d1f; }
    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    .pdf-card {
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: #fafafa;
    }
    .pdf-card h3 { margin-bottom: 8px; font-size: 18px; }
    .pdf-card p { font-size: 13px; color: #666; margin-bottom: 16px; }
    .pdf-card .actions { display: flex; gap: 8px; justify-content: center; }
    .mapping-table { width: 100%; border-collapse: collapse; }
    .mapping-table th, .mapping-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #eee;
      font-size: 13px;
      text-align: left;
    }
    .mapping-table th { background: #f5f5f7; font-weight: 600; }
    .mapping-table td:first-child { font-family: monospace; font-size: 12px; color: #555; }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .tag-text { background: #e8f0fe; color: #1a73e8; }
    .tag-checkbox { background: #fce8f3; color: #c01680; }
    .back-link { font-size: 13px; color: #0071e3; text-decoration: none; margin-bottom: 20px; display: inline-block; }
    .back-link:hover { text-decoration: underline; }
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 24px;
    }
    @media (max-width: 600px) { .fields-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>PDF Form Filler</h1>
    <a href="/">Home</a>
  </header>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
