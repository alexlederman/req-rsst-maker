<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Form Filler</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 32px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .container { max-width: 700px; margin: 48px auto; padding: 0 24px; }
    h2 { font-size: 15px; font-weight: 600; color: #666; text-transform: uppercase;
         letter-spacing: 0.06em; margin-bottom: 16px; }
    .folder-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .folder-card {
      display: block;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px 20px;
      transition: box-shadow 0.15s, border-color 0.15s;
      color: inherit;
    }
    .folder-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-color: #0071e3;
    }
    .folder-icon { font-size: 32px; margin-bottom: 10px; }
    .folder-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .folder-meta { font-size: 13px; color: #888; }
    .empty { color: #888; font-size: 15px; }
  </style>
</head>
<body>
  <header><h1>PDF Form Filler</h1></header>
  <div class="container">
    <h2>Template Folders</h2>
    {% if folders %}
    <div class="folder-grid">
      {% for folder in folders %}
      <a href="/sheet/{{ folder.name }}" class="folder-card">
        <div class="folder-icon">📁</div>
        <div class="folder-name">{{ folder.name }}</div>
        <div class="folder-meta">{{ folder.pdf_count }} template{{ 's' if folder.pdf_count != 1 else '' }}</div>
      </a>
      {% endfor %}
    </div>
    {% else %}
    <p class="empty">No template folders found in <code>Templates/</code>.</p>
    {% endif %}
  </div>
</body>
</html>
